<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy">
    <title>Kimi Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe WPC', 'Segoe UI', system-ui, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            color: #f8f8f8;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background-color: #1e1e1e;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
        }
        .user-message {
            background-color: #1d94f518;
            align-self: flex-end;
            margin-left: auto;
        }
        .kimi-message {
            background-color: #252526;
            align-self: flex-start;
        }
        #input-container {
            display: flex;
            margin-top: 10px;
        }
        #prompt {
            flex: 1;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px 0 0 4px;
            background-color: #1e1e1e;
            color: #f8f8f8;
        }
        #send-button {
            padding: 10px 15px;
            border: 1px solid #333;
            border-radius: 0 4px 4px 0;
            background-color: #0078d7;
            color: white;
            cursor: pointer;
        }
        #send-button:hover {
            background-color: #0066b0;
        }
        .markdown-body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe WPC', 'Segoe UI', system-ui, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #f8f8f8;
        }
        .markdown-body code {
            background-color: #252526;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
        }
        .markdown-body pre {
            background-color: #252526;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .markdown-body h1 {
            font-size: 24px;
        }
        .markdown-body h2 {
            font-size: 20px;
        }
        .markdown-body h3 {
            font-size: 18px;
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 20px;
        }
        .markdown-body li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="prompt" placeholder="Ask Kimi anything...">
        <button id="send-button">Send</button>
    </div>
    <footer>
        <p style="color: #c9c4c475; text-align: center; size: 8px;">Powered by @Nourreddine HOUARI</p>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <script>
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt');
        const sendButton = document.getElementById('send-button');
        let vscodeApi = acquireVsCodeApi();

        function createMessageElement(text, isUser) {
            const messageElement = document.createElement('div');
            messageElement.className = isUser ? 'message user-message' : 'message kimi-message';
            messageElement.textContent = text;
            return messageElement;
        }

        function createMarkdownMessageElement(markdownHtml, isUser) {
            console.log("Creating markdown message element:");
            console.log(markdownHtml)
            const messageElement = document.createElement('div');
            messageElement.className = isUser ? 'message user-message' : 'message kimi-message';
            messageElement.innerHTML = marked.parse(markdownHtml);
            console.log(markdownHtml)
            // Apply syntax highlighting to code blocks
            messageElement.querySelectorAll('pre code').forEach((block) => {
                console.log("Found code block:");
                console.log(block);
                hljs.highlightElement(block);
            });
            return messageElement;
        }

        async function sendPrompt() {
            console.log('Send button clicked with message: ');
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            // Disable the send button
            sendButton.disabled = true;
            sendButton.textContent = 'Sending...';

            // Add user message to chat
            chatContainer.appendChild(createMarkdownMessageElement(prompt, true));
            promptInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Send prompt to Kimi via VS Code API
                vscodeApi.postMessage({
                    command: 'sendPrompt',
                    text: prompt
                });
            } catch (error) {
                console.error('Error sending prompt:', error);

                // Re-enable the send button in case of an error
                sendButton.disabled = false;
                sendButton.textContent = 'Send';
            }
        }

        // Event listener for send button
        sendButton.addEventListener('click', sendPrompt);

        // Event listener for Enter key
        promptInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendPrompt();
            }
        });

        // Listen for messages from VS Code
        window.addEventListener('message', (event) => {
            if (event.data.command === 'receiveResponse') {
                const response = event.data.response;

                // Add Kimi's response to the chat
                chatContainer.appendChild(createMarkdownMessageElement(response, false));
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // Re-enable the send button after receiving a response
                sendButton.disabled = false;
                sendButton.textContent = 'Send';
            }
        });
    </script>
</body>
</html>
